[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "Progressive MCP learning project: a personal knowledge-base server"
readme = "README.md"
authors = [
    { name = "Patrik Túri", email = "patrik.turi.0xff@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.13.5",
]

[project.scripts]
knowledge-mcp = "knowledge_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = true
