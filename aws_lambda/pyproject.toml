[project]
name = "aws-lambda-cdk"
version = "0.1.0"
description = "Learn AWS Lambda with Python CDK (Step A)"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.220.0",
    "constructs>=10.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks", "cdk_constructs"]

[tool.uv]
package = true
